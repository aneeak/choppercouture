name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eigene Gruppe statt des frueheren "pages": Am 06.10.2026 blieb ein
# Deployment auf GitHubs Seite im Status waiting haengen. Weil der Lauf die
# Gruppe nie freigab, konnte kein spaeterer Lauf mehr starten, obwohl mit
# dem Code alles in Ordnung war. Ein neuer Gruppenname loest die Blockade.
# cancel-in-progress sorgt dafuer, dass ein haengender Lauf kuenftig nicht
# mehr alles dahinter aufhaelt: Der neuere Stand gewinnt, was bei einer
# Website genau richtig ist.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
